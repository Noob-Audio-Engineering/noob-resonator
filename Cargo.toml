[package]
name = "noob-resonator"
description = "Noob Resonator, a free modal and waveguide resonator whose editor is the OS web view rendering a Vue + Tailwind SPA over noob-vst-webgui-framework"
readme = "README.md"
version = "0.1.0"
authors = ["Ely Erin Fox"]
edition = "2024"
# 2024 needs 1.85; `let`-chains in the page-facing code need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Noob-Audio-Engineering/noob-resonator"
homepage = "https://github.com/Noob-Audio-Engineering/noob-resonator"
# A plug-in, not a library: nothing here goes to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "noob-resonator-standalone"
path = "src/bin/standalone.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[features]
default = []
# Build the real VST3 / CLAP plug-in (pulls nih-plug from git and embeds
# `web/dist`, so run `npm run build` in `web/` first). Without it the crate is
# just the DSP plus the standalone dev server.
plugin = ["dep:nih_plug", "dep:noob-vst-webgui-framework-nih", "dep:include_dir"]
# Right-click -> Inspect inside the plug-in window, in a release build.
devtools = ["noob-vst-webgui-framework-nih/devtools"]
# The plug-in outside a DAW, for debugging the editor. Not shipped.
hostapp = ["plugin", "devtools", "nih_plug/standalone"]

[dependencies]
noob-vst-webgui-framework = { git = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework" }
noob-vst-webgui-framework-nih = { git = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework", optional = true }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
include_dir = { version = "0.7", optional = true }
log = "0.4"
env_logger = "0.11"
serde_json = "1"
# Counting resolved partials in an output is a spectral measurement, so the
# benchmark and the tests need an FFT. It is a dependency of the measurement,
# not of the audio path.
rustfft = "6"

[profile.release]
lto = "thin"
codegen-units = 1

# Host-driven editor resizing needs the patched nih-plug the framework is
# built against; Cargo only honours patches in the root manifest, so every
# plug-in repository carries this line.
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { git = "https://github.com/Noob-Audio-Engineering/nih-plug.git", branch = "host-resize" }

[[bin]]
name = "noob-resonator-host"
path = "src/bin/host.rs"
required-features = ["hostapp"]
